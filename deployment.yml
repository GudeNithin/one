apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-dp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flm
  template:
    metadata:
      name: flm-devops
      labels:
        app: flm
    spec:
      containers:
        - name: app
          image: chandramouli18/recap:appimage
          ports:
            - containerPort: 80
